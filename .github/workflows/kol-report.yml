name: kol-report

on:
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      XPOZ_API_KEY: ${{ secrets.XPOZ_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
      FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
        working-directory: ./cloud_automation
      - run: python -m app.main_kol
        working-directory: ./cloud_automation
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cloud_automation/reports/
          git commit -m "chore: update kol report" || echo "no changes"
          git push
