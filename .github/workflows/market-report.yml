name: market-report

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
      DWELLIR_API_KEY: ${{ secrets.DWELLIR_API_KEY }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      QUICKNODE_SOLANA_RPC_URL: ${{ secrets.QUICKNODE_SOLANA_RPC_URL }}
      WECOM_BOT_WEBHOOK_URL: ${{ secrets.WECOM_BOT_WEBHOOK_URL }}
      XPOZ_API_KEY: ${{ secrets.XPOZ_API_KEY }}
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Generate Market Report
        run: python -m app.main_market
      - name: Commit Generated Reports
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore: update market report"
          git push
